name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Core tests touch no network: they build real tar fixtures in-process.
      - name: Test core
        run: npm run test -w @gitscribe/core

      - name: Test extension
        run: npm run test -w @gitscribe/extension

      - name: Typecheck everything
        run: npm run typecheck

      - name: Build all packages
        run: npm run build

      # A model whose context window has not been re-checked in 90 days is a
      # claim we can no longer stand behind.
      - name: Model registry freshness
        run: node scripts/check-model-freshness.mjs
